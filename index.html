<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Practice Problems — Algebra Set 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Lora:ital,wght@0,500;0,600;1,500&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF1F6;
    --rule:#C3CEE3;
    --ink:#243044;
    --pen:#B4432E;
    --pen-soft:#c96b56;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  ::selection{background:var(--pen-soft);color:#fff;}

  @keyframes fadeUp{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
  @keyframes pop{
    0%{transform:scale(0.4); opacity:0;}
    60%{transform:scale(1.25);}
    100%{transform:scale(1); opacity:1;}
  }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-3px);}
    75%{transform:translateX(3px);}
  }
  @keyframes blink{
    0%,49%{opacity:1;}
    50%,100%{opacity:0;}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important;}
  }

  /* ---------- WORKSHEET ---------- */
  #worksheet{
    background:
      repeating-linear-gradient(var(--paper) 0 38px, var(--rule) 38px 39px);
    color:var(--ink);
    font-family:'Lora', serif;
    padding:56px 22px 40px;
    min-height:100vh;
  }
  .head{
    font-family:'Architects Daughter', cursive;
    font-size:clamp(28px,7vw,40px);
    margin:0 0 4px;
  }
  .sub{
    font-size:15px;
    opacity:.65;
    margin:0 0 40px;
    letter-spacing:.02em;
  }
  .problem{
    max-width:560px;
    margin:0 auto 46px;
    opacity:0;
    animation:fadeUp .5s ease forwards;
  }
  .problem:nth-of-type(1){animation-delay:.05s;}
  .problem:nth-of-type(2){animation-delay:.15s;}
  .problem:nth-of-type(3){animation-delay:.25s;}
  .problem:nth-of-type(4){animation-delay:.35s;}
  .problem:nth-of-type(5){animation-delay:.45s;}
  .problem .num{
    font-family:'Architects Daughter', cursive;
    color:var(--pen);
    font-size:20px;
    margin-right:6px;
  }
  .problem p{
    font-size:19px;
    line-height:1.6;
    margin:6px 0 14px;
  }
  .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  input.ans{
    font-family:'Lora',serif;
    font-size:17px;
    border:none;
    border-bottom:2px solid var(--ink);
    background:transparent;
    padding:4px 2px;
    width:110px;
    color:var(--ink);
    caret-color:var(--pen);
    transition:border-color .2s ease;
  }
  input.ans:focus{outline:none; border-color:var(--pen);}
  button.check{
    font-family:'Lora',serif;
    font-size:14px;
    border:1.5px solid var(--ink);
    background:transparent;
    color:var(--ink);
    padding:7px 14px;
    border-radius:3px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease, transform .1s ease;
  }
  button.check:hover{background:var(--ink); color:var(--paper);}
  button.check:active{transform:scale(.94);}
  .fb{
    font-family:'Architects Daughter', cursive;
    color:var(--pen);
    font-size:17px;
    margin-left:4px;
    min-width:20px;
    display:inline-block;
  }
  .fb.pop{animation:pop .3s ease;}
  .fb.wrong{animation:shake .3s ease;}

  .snip{
    max-width:560px;
    margin:64px auto 0;
    text-align:center;
    opacity:.35;
    font-size:13px;
    letter-spacing:.3em;
    border-top:1px dashed var(--ink);
    padding-top:8px;
  }
  footer{
    max-width:560px;
    margin:14px auto 10px;
    text-align:center;
    opacity:.45;
    font-size:12px;
    font-family:'Lora',serif;
  }
  #calcOpen{
    background:none;
    border:none;
    font-size:12px;
    font-family:'Lora',serif;
    color:var(--ink);
    opacity:.7;
    cursor:pointer;
    text-decoration:underline;
    padding:4px;
    transition:opacity .2s ease;
  }
  #calcOpen:hover{opacity:1;}

  /* ---------- CALCULATOR ---------- */
  #calc{
    position:fixed; inset:0;
    background:#F7F9FF;
    display:none;
    flex-direction:column;
    padding:18px 14px 24px;
    z-index:50;
    opacity:0;
    transform:translateY(14px);
    transition:opacity .25s ease, transform .25s ease;
  }
  #calc.show{display:flex; opacity:1; transform:translateY(0);}
  .calc-card{
    background:#fff;
    border:1px solid #E4E8F5;
    border-radius:22px;
    padding:18px 20px;
    height:120px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(30,50,120,.05);
  }
  .calc-history{color:#8891A8;}
  .calc-display{
    color:#1B1F2A;
    font-family:-apple-system,'SF Pro Display',system-ui,sans-serif;
    font-weight:400;
    font-size:min(13vw,52px);
    font-variant-numeric:tabular-nums;
    text-align:right;
    letter-spacing:-1px;
    overflow:hidden;
    white-space:nowrap;
    transition:opacity .1s ease;
  }
  .calc-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    grid-template-rows:repeat(5,1fr);
    gap:10px;
    flex:1;
  }
  .calc-grid button{
    border-radius:999px;
    border:none;
    font-size:clamp(18px,5.5vw,24px);
    font-family:-apple-system,system-ui,sans-serif;
    cursor:pointer;
    transition:transform .08s ease, filter .08s ease;
  }
  .calc-grid button:active{transform:scale(.92);}
  .k-num{background:#F1F2F7; color:#1B1F2A;}
  .k-num:active{background:#E4E6EF;}
  .k-fn{background:#E3E8FD; color:#2547D0;}
  .k-fn:active{background:#d2d9fb;}
  .k-op{background:#E3E8FD; color:#2547D0; font-weight:600;}
  .k-op:active{background:#d2d9fb;}
  .k-eq{background:#2A56E8; color:#fff; font-weight:600;}
  .k-eq:active{background:#1f45c4;}

  /* ---------- BUILD LAB ---------- */
  #lab{
    display:none;
    min-height:100vh;
    background:#04160b;
    color:#8cffb0;
    font-family:'VT323', monospace;
    padding:26px 16px 60px;
    position:relative;
    overflow-x:hidden;
    opacity:0;
    transform:scale(.98);
  }
  #lab.show{display:block; animation:labIn .5s ease forwards;}
  @keyframes labIn{
    from{opacity:0; transform:scale(.98);}
    to{opacity:1; transform:scale(1);}
  }
  .cursor{
    display:inline-block;
    width:.55em; height:1em;
    background:#8cffb0;
    vertical-align:-2px;
    margin-left:2px;
    animation:blink 1s step-end infinite;
  }
  #lab::before{
    content:'';
    position:fixed; inset:0;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.25) 0 2px, transparent 2px 4px);
    pointer-events:none;
    z-index:2;
  }
  .lab-title{
    font-family:'Press Start 2P', monospace;
    font-size:clamp(16px,5vw,24px);
    color:#8cffb0;
    text-shadow:0 0 8px rgba(140,255,176,.6);
    margin:0 0 6px;
  }
  .lab-sub{
    font-size:18px;
    opacity:.7;
    margin:0 0 26px;
  }
  #buildDesc{
    width:100%;
    background:#02100a;
    border:1px solid #1f7a4d;
    color:#c9ffdc;
    font-family:'VT323', monospace;
    font-size:20px;
    padding:12px;
    border-radius:2px;
    resize:vertical;
    min-height:70px;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  #buildDesc:focus{outline:none; border-color:#8cffb0; box-shadow:0 0 0 3px rgba(140,255,176,.15);}
  .lab-actions{
    display:flex; gap:10px; margin-top:12px; flex-wrap:wrap;
  }
  #genBtn{
    background:#8cffb0;
    color:#04160b;
    border:none;
    font-family:'Press Start 2P', monospace;
    font-size:12px;
    padding:14px 18px;
    cursor:pointer;
    border-radius:2px;
    transition:transform .1s ease, box-shadow .2s ease;
  }
  #genBtn:hover:not(:disabled){box-shadow:0 0 16px rgba(140,255,176,.5);}
  #genBtn:active:not(:disabled){transform:scale(.96);}
  #genBtn:disabled{opacity:.5; cursor:default;}
  #resetBtn{
    background:transparent;
    color:#8cffb0;
    border:1px solid #1f7a4d;
    font-family:'VT323', monospace;
    font-size:16px;
    padding:10px 16px;
    cursor:pointer;
    border-radius:2px;
    transition:border-color .2s ease, transform .1s ease;
  }
  #resetBtn:hover{border-color:#8cffb0;}
  #resetBtn:active{transform:scale(.96);}
  .status{
    font-size:18px;
    margin-top:10px;
    min-height:22px;
    opacity:.85;
  }
  #preview{
    width:100%;
    height:62vh;
    margin-top:20px;
    border:1px solid #1f7a4d;
    border-radius:2px;
    background:#fff;
    opacity:0;
    transition:opacity .4s ease;
  }
  #preview.loaded{opacity:1;}
</style>
</head>
<body>

<!-- ============ WORKSHEET ============ -->
<div id="worksheet">
  <h1 class="head">Practice Problems</h1>
  <p class="sub">Algebra — Set 4 · Solve each equation for x</p>

  <div class="problem" data-answer="7">
    <span class="num">1.</span><p>4x − 7 = 21</p>
    <div class="row">
      <span>x =</span><input class="ans" type="text" inputmode="decimal">
      <button class="check">Check</button><span class="fb"></span>
    </div>
  </div>

  <div class="problem" data-answer="12">
    <span class="num">2.</span><p>3(x − 4) = 24</p>
    <div class="row">
      <span>x =</span><input class="ans" type="text" inputmode="decimal">
      <button class="check">Check</button><span class="fb"></span>
    </div>
  </div>

  <div class="problem" data-answer="9">
    <span class="num">3.</span><p>5x + 11 = 56</p>
    <div class="row">
      <span>x =</span><input class="ans" type="text" inputmode="decimal">
      <button class="check">Check</button><span class="fb"></span>
    </div>
  </div>

  <div class="problem" data-answer="6">
    <span class="num">4.</span><p>2(3x − 2) = 32</p>
    <div class="row">
      <span>x =</span><input class="ans" type="text" inputmode="decimal">
      <button class="check">Check</button><span class="fb"></span>
    </div>
  </div>

  <div class="problem" data-answer="15">
    <span class="num">5.</span><p>x/3 + 2 = 7</p>
    <div class="row">
      <span>x =</span><input class="ans" type="text" inputmode="decimal">
      <button class="check">Check</button><span class="fb"></span>
    </div>
  </div>

  <div class="snip">✂ ⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯⋯</div>
  <footer>
    Set 4 of 12 · show your work<br><br>
    <button id="calcOpen" type="button">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px; margin-right:3px;">
        <rect x="4" y="2" width="16" height="20" rx="2"/>
        <line x1="8" y1="6" x2="16" y2="6"/>
        <line x1="8" y1="10" x2="8" y2="10"/>
        <line x1="12" y1="10" x2="12" y2="10"/>
        <line x1="16" y1="10" x2="16" y2="10"/>
        <line x1="8" y1="14" x2="8" y2="14"/>
        <line x1="12" y1="14" x2="12" y2="14"/>
        <line x1="16" y1="14" x2="16" y2="14"/>
        <line x1="8" y1="18" x2="8" y2="18"/>
        <line x1="12" y1="18" x2="12" y2="18"/>
        <line x1="16" y1="18" x2="16" y2="18"/>
      </svg>calculator
    </button>
  </footer>
</div>

<!-- ============ CALCULATOR ============ -->
<div id="calc">
  <div class="calc-card">
    <svg class="calc-history" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 3v5h5"/>
      <path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/>
      <path d="M12 7v5l4 2"/>
    </svg>
    <div class="calc-display" id="calcDisplay">0</div>
  </div>
  <div class="calc-grid">
    <button class="k-fn" data-k="(">(</button>
    <button class="k-fn" data-k=")">)</button>
    <button class="k-fn" data-k="%">%</button>
    <button class="k-fn" data-k="AC">AC</button>

    <button class="k-num" data-k="7">7</button>
    <button class="k-num" data-k="8">8</button>
    <button class="k-num" data-k="9">9</button>
    <button class="k-op" data-k="/">&divide;</button>

    <button class="k-num" data-k="4">4</button>
    <button class="k-num" data-k="5">5</button>
    <button class="k-num" data-k="6">6</button>
    <button class="k-op" data-k="x">&times;</button>

    <button class="k-num" data-k="1">1</button>
    <button class="k-num" data-k="2">2</button>
    <button class="k-num" data-k="3">3</button>
    <button class="k-op" data-k="-">&minus;</button>

    <button class="k-num" data-k="0">0</button>
    <button class="k-num" data-k=".">.</button>
    <button class="k-eq" data-k="=">=</button>
    <button class="k-op" data-k="+">+</button>
  </div>
</div>

<!-- ============ BUILD LAB ============ -->
<div id="lab">
  <div class="lab-title">BUILD LAB</div>
  <p class="lab-sub">describe something. it gets built. try it below.<span class="cursor"></span></p>
  <textarea id="buildDesc" placeholder="e.g. a simple flappy-bird style thing with a red square dodging green pipes"></textarea>
  <div class="lab-actions">
    <button id="genBtn">GENERATE</button>
    <button id="resetBtn" type="button">reset</button>
  </div>
  <div class="status" id="labStatus"></div>
  <iframe id="preview" sandbox="allow-scripts" title="build preview"></iframe>
</div>

<script>
  // ---------- worksheet checking ----------
  document.querySelectorAll('.problem').forEach(p=>{
    const answer = p.dataset.answer;
    const input = p.querySelector('.ans');
    const fb = p.querySelector('.fb');
    p.querySelector('.check').addEventListener('click', ()=>{
      const correct = input.value.trim() === answer;
      fb.textContent = correct ? '✓' : '✗';
      fb.classList.remove('pop','wrong');
      void fb.offsetWidth; // restart animation
      fb.classList.add(correct ? 'pop' : 'wrong');
    });
  });

  // ---------- open calculator ----------
  const calc = document.getElementById('calc');
  document.getElementById('calcOpen').addEventListener('click', ()=>{
    calc.classList.add('show');
  });

  // ---------- calculator logic + hidden unlock ----------
  const display = document.getElementById('calcDisplay');
  let expr = '';        // what's shown / evaluated
  let codeBuffer = '';  // consecutive raw digits since last operator/clear
  const OP_SYMBOL = { '/':'÷', 'x':'×', '-':'−', '+':'+' };

  function render(){ display.textContent = expr === '' ? '0' : expr; }

  function safeEval(str){
    const cleaned = str.replace(/x/gi,'*');
    if(!/^[0-9+\-*/.%() ]+$/.test(cleaned)) return '0';
    try{
      // eslint-disable-next-line no-new-func
      const val = Function('"use strict"; return (' + cleaned + ')')();
      return Number.isFinite(val) ? String(val) : '0';
    }catch(e){ return '0'; }
  }

  document.querySelectorAll('#calc [data-k]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const k = btn.dataset.k;

      if(k === 'AC'){ expr=''; codeBuffer=''; render(); return; }

      if(k === '='){
        if(codeBuffer === '3012'){
          unlockLab();
          return;
        }
        expr = safeEval(expr);
        codeBuffer = '';
        render();
        return;
      }

      if(['+','-','x','/','%','(',')'].includes(k)){
        codeBuffer = '';
        expr += (OP_SYMBOL[k] || k);
        render();
        return;
      }

      // digit or decimal point
      expr += k;
      if(k !== '.'){ codeBuffer += k; } else { codeBuffer=''; }
      render();
    });
  });

  function unlockLab(){
    calc.classList.remove('show');
    calc.style.display = 'none';
    document.getElementById('lab').classList.add('show');
  }

  // ---------- build generator ----------
  const genBtn = document.getElementById('genBtn');
  const desc = document.getElementById('buildDesc');
  const status = document.getElementById('labStatus');
  const preview = document.getElementById('preview');

  const SYSTEM_PROMPT = `You are an interactive experience developer. Output ONE complete, self-contained HTML document (inline CSS and JavaScript only, no external libraries, no external assets, no network calls). It must implement a small, actually playable browser-based interactive experience based on the user's description, controllable with touch/click and arrow keys. Respond with ONLY raw HTML starting at <!DOCTYPE html> — no explanations, no markdown code fences, no commentary.`;

  async function callModel(prompt, reasoningEffort){
    const res = await fetch('https://text.pollinations.ai/openai', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'openai',
        reasoning_effort: reasoningEffort,
        max_tokens: 4000,
        messages: [
          { role: 'system', content: SYSTEM_PROMPT },
          { role: 'user', content: 'Description: ' + prompt }
        ]
      })
    });
    const data = await res.json();
    if(data?.error){ throw new Error(typeof data.error === 'string' ? data.error : (data.error.message || 'API error')); }
    let code = data?.choices?.[0]?.message?.content || '';
    code = code.trim().replace(/^```(?:html)?\s*/i, '').replace(/```$/,'').trim();
    return code;
  }

  async function generateBuild(){
    const prompt = desc.value.trim();
    if(!prompt){ status.textContent = '> enter a description first'; return; }
    genBtn.disabled = true;
    preview.classList.remove('loaded');
    preview.srcdoc = '';

    let code = '';
    try{
      status.textContent = '> thinking...';
      code = await callModel(prompt, 'medium');
      if(!code.toLowerCase().includes('<html')){
        status.textContent = '> first attempt incomplete, retrying...';
        code = await callModel(prompt, 'low');
      }
    }catch(e){
      status.textContent = '> connection error, try again (' + e.message + ')';
      genBtn.disabled = false;
      return;
    }

    if(!code.toLowerCase().includes('<html')){
      status.textContent = '> build failed twice — try a shorter, simpler description';
      genBtn.disabled = false;
      return;
    }

    status.textContent = '> compiling...';
    preview.srcdoc = code;
    preview.onload = ()=> preview.classList.add('loaded');
    status.textContent = '> ready';
    genBtn.disabled = false;
  }

  genBtn.addEventListener('click', generateBuild);
  document.getElementById('resetBtn').addEventListener('click', ()=>{
    desc.value=''; preview.srcdoc=''; status.textContent=''; preview.classList.remove('loaded');
  });
</script>
</body>
</html>
