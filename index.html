<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Finger Detector</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
    }

    #container {
      position: relative;
      width: 640px;
      height: 480px;
      border: 3px solid #333;
      border-radius: 12px;
      overflow: hidden;
    }

    video {
      width: 640px;
      height: 480px;
      transform: scaleX(-1); /* Mirror camera feed */
    }

    /* Green Box Overlay */
    #box {
      position: absolute;
      top: 140px;
      left: 220px;
      width: 200px;
      height: 200px;
      background-color: rgba(0, 255, 0, 0.4); /* Half-transparent Green */
      border: 3px solid #00ff00;
      border-radius: 10px;
      transition: background-color 0.2s, border-color 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 18px;
      pointer-events: none;
    }

    /* Red Box when finger is inside */
    #box.active {
      background-color: rgba(255, 0, 0, 0.6); /* Half-transparent Red */
      border-color: #ff0000;
    }
  </style>

  <!-- Free AI Hand Tracking Libraries from MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <h1>Finger Detector</h1>
  <div id="container">
    <video id="webcam" autoplay playsinline></video>
    <div id="box">Put Finger Here</div>
  </div>

  <script>
    const videoElement = document.getElementById('webcam');
    const boxElement = document.getElementById('box');

    // Box position and size (matching CSS)
    const boxX = 220;
    const boxY = 140;
    const boxWidth = 200;
    const boxHeight = 200;

    // Initialize MediaPipe AI Hands
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    // Check hand positions on every camera frame
    hands.onResults((results) => {
      let isInside = false;

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        
        // Landmark 8 is the Index Finger Tip
        const indexFingerTip = landmarks[8];

        // Convert camera coordinates to pixel coordinates (flipping X for mirrored feed)
        const fingerX = (1 - indexFingerTip.x) * 640;
        const fingerY = indexFingerTip.y * 480;

        // Check if finger is inside the target box coordinates
        if (
          fingerX >= boxX &&
          fingerX <= boxX + boxWidth &&
          fingerY >= boxY &&
          fingerY <= boxY + boxHeight
        ) {
          isInside = true;
        }
      }

      // Turn box Red if finger is inside, otherwise Green
      if (isInside) {
        boxElement.classList.add('active');
        boxElement.innerText = "FINGER DETECTED!";
      } else {
        boxElement.classList.remove('active');
        boxElement.innerText = "Put Finger Here";
      }
    });

    // Start Webcam
    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });

    camera.start();
  </script>
</body>
</html>
